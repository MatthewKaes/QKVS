[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qkvs"]

[project]
name = "qkvs-research"
version = "0.1.0"
description = "Research prototype for learned direct-address sparse attention"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.4",
  "torch==2.9.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.1",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
